<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Simulador empresarial do Grupo LP: lojas, frota, estoque e resultados.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Grupo LP">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grupo LP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="lp-apple-touch-icon.png">
<link rel="icon" type="image/png" href="lp-icon-192.png">
<title>Grupo LP – Simulador Empresarial</title>
<style>
:root{--bg:#070b14;--pn:#0f1626;--pn2:#141d31;--ln:#22304a;--tx:#eef3fb;--mu:#8090a8;--ac:#ffb400;--ok:#22c55e;--bad:#ef4444;--blue:#3b82f6;--side:232px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI",Roboto,system-ui,sans-serif}
html,body{height:100%}
body{background:radial-gradient(1000px 700px at 85% -10%,#18284a 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#13253d 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);-webkit-font-smoothing:antialiased}
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:linear-gradient(180deg,#0c1322,#0a0f1c);border-right:1px solid var(--ln);display:flex;flex-direction:column;z-index:6}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--ln)}
.brand img{width:42px;height:42px;border-radius:10px;background:#fff;object-fit:contain}
.brand b{display:block;font-size:15px;letter-spacing:.3px}.brand span{font-size:10px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
#nav{flex:1;overflow:auto;padding:8px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#aab6c9;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:2px;transition:.15s}
#nav button i{font-style:normal;font-size:16px;width:22px;text-align:center}
#nav button:hover{background:#ffffff08;color:#fff}
#nav button.on{background:linear-gradient(90deg,#ffb40026,#ffb40008);color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.sidefoot{padding:12px 14px;border-top:1px solid var(--ln);font-size:11px;color:var(--mu)}
#top{position:sticky;top:0;z-index:5;margin-left:var(--side);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;background:#0a1020cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#top h2{font-size:18px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{display:block;font-size:9px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.chip.ok{color:var(--ok)}
main{margin-left:var(--side);padding:18px;max-width:1500px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:linear-gradient(180deg,#141d31f2,#0f1626f2);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #0007}
.card h3{font-size:11px;margin-bottom:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.kpi{background:linear-gradient(160deg,#111a2c,#0b1220);border:1px solid var(--ln);border-radius:12px;padding:12px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:var(--k,#ffb400);opacity:.09}
.kpi b{display:block;font-size:19px;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.kpi em{font-style:normal;font-size:11px;color:var(--mu)}
.up{color:var(--ok)!important}.dn{color:var(--bad)!important}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 7px;border-bottom:1px solid #1b2740;text-align:left;vertical-align:middle}
th{color:var(--mu);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.9px;position:sticky;top:0;background:#111a2c}
tr:hover td{background:#ffffff05}
.tw{overflow:auto;max-height:560px;border-radius:10px}
button.b{background:linear-gradient(180deg,#ffc53a,#f0a200);color:#1a1200;border:none;border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;margin:2px;box-shadow:0 2px 8px #0006;transition:.12s}
button.b:hover{filter:brightness(1.08)}button.b:active{transform:translateY(1px)}
button.r{background:linear-gradient(180deg,#f05252,#c62828);color:#fff}
button.g{background:linear-gradient(180deg,#34d07f,#1e9b57);color:#fff}
button.bl{background:linear-gradient(180deg,#4f8ff7,#2563eb);color:#fff}
button.s{background:#1d2a42;color:var(--tx);box-shadow:none;border:1px solid var(--ln)}
select,input,textarea{background:#0a1120;color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:8px 9px;font-size:12.5px;outline:none}
select:focus,input:focus{border-color:var(--ac);box-shadow:0 0 0 3px #ffb40022}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:5px 0}
.row.sb{justify-content:space-between}
canvas{width:100%;display:block;border-radius:14px;background:#0b111c}
.tag{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;color:#fff;letter-spacing:.3px;white-space:nowrap}
.LP{background:#2a3c9e}.LF{background:#0f8f86}.PT{background:#008a3e}.PL{background:#d97a00}.CT{background:#c2410c}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#1d2a42;color:#b8c4d8}
.pill.g{background:#22c55e22;color:#86efac}.pill.r{background:#ef444422;color:#fca5a5}.pill.y{background:#f5b40022;color:#fcd34d}.pill.b{background:#3b82f622;color:#93c5fd}
.log{max-height:260px;overflow:auto;font-size:12px;color:#b5c1d3}
.log div{padding:7px 2px;border-bottom:1px solid #1b2740}
.muted{color:var(--mu);font-size:11.5px}
.seg{display:inline-flex;background:#0a1120;border:1px solid var(--ln);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:#9fb0c8;padding:7px 11px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ac);color:#1a1200}
.bars{display:flex;gap:3px;align-items:flex-end;height:120px;padding-top:6px}
.bars div{flex:1;background:linear-gradient(180deg,#ffc53a,#f08a00);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.cur{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.axis{display:flex;gap:3px;font-size:9px;color:var(--mu)}.axis span{flex:1;text-align:center}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#0f1626ee;backdrop-filter:blur(8px);border:1px solid var(--ac);color:var(--tx);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;display:none;z-index:50;box-shadow:0 8px 30px #000a}
#modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
.mw{background:linear-gradient(180deg,#141d31,#0d1424);border:1px solid var(--ln);border-radius:18px;padding:18px;width:100%;max-width:640px;max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000}
.mw.big{max-width:1100px}
.mw h2{font-size:17px;margin-bottom:10px}
.chat{background:#0a1120;border:1px solid var(--ln);border-radius:12px;padding:10px;max-height:300px;overflow:auto;margin:10px 0}
.msg{padding:8px 11px;border-radius:12px;margin:5px 0;font-size:13px;max-width:85%;line-height:1.4}
.msg.eu{background:#2563eb;margin-left:auto;color:#fff;border-bottom-right-radius:3px}
.msg.ele{background:#1d2a42;border-bottom-left-radius:3px}
.msg.sys{background:none;color:var(--mu);font-size:11px;text-align:center;max-width:100%}
.dealer{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.veh{background:#0b1220;border:1px solid var(--ln);border-radius:12px;padding:10px}
.veh canvas{border-radius:8px;background:linear-gradient(180deg,#dfe7f2,#b9c6d8);height:110px}
.camgrid{display:grid;gap:10px}
.cam{background:#020408;border:1px solid #1d2a42;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:.2s}
.cam canvas{border-radius:0;background:#000}
.cam .cb{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:#0b1220;font-size:11.5px;font-weight:700}
.cam.cr{border-color:#ef4444;box-shadow:0 0 0 1px #ef4444,0 0 18px #ef444455}.cam.cy{border-color:#f5b400}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;margin-right:6px}
.led.r{background:#ef4444;box-shadow:0 0 6px #ef4444}.led.y{background:#f5b400;box-shadow:0 0 6px #f5b400}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.ctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:#0b1220dd;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.cvwrap{position:relative}
.formg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.formg label{font-size:10px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.8px;display:flex;flex-direction:column;gap:4px}
@media(max-width:900px){
 :root{--side:0px}
 #side{inset:auto 0 0 0;width:100%;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
 .brand,.sidefoot{display:none}
 #nav{display:flex;overflow-x:auto;padding:4px;scrollbar-width:none}
 #nav button{flex-direction:column;gap:2px;min-width:68px;font-size:10px;padding:7px 4px;text-align:center;margin:0}
 #nav button.on{box-shadow:inset 0 3px 0 var(--ac)}
 #top{padding:8px 10px}#top h2{font-size:15px;width:100%}
 .chip{padding:5px 8px;font-size:11px}
 main{padding:10px;padding-bottom:96px}
 .g2,.g3{grid-template-columns:1fr}
 .card{padding:12px;border-radius:14px}
 .kpis{grid-template-columns:1fr 1fr}
 .kpi b{font-size:16px}
 .camgrid{grid-template-columns:1fr 1fr!important;gap:6px}
 #toast{bottom:90px}
}
</style>
</head>

 chatAdd("eu",`Proponho ${R$(v)}${n>1?` em ${n}x`:""}, pagando em ${p} dias.`);
 const exig=NG.min*(1+p/365*.6+(n-1)*.012),juros=c.cat==="Impostos"&&n>1;

  const f=motoristas().find(m=>(v.mot===m.id||!S.frota.some(x=>x.mot===m.id&&x.auto&&x!==v&&x.status==="Garagem"))&&motLivre(m));if(!f)return;
  let im=null;if(v.tipo==="cavalo"){im=S.frota.find(x=>x.tipo==="implemento"&&x.status==="Garagem");if(!im)return}
  const alvo=lojasVenda().filter(l=>!S.frota.some(x=>x.dest===l.id&&x.status==="Viagem")).map(l=>{const ps=S.prods.filter(p=>p.seg===segDe(l));return{l,s:ps.reduce((a,p)=>a+(l.est[p.id]||0),0)/(ps.length||1)}}).sort((a,b)=>a.s-b.s)[0];
  if(alvo&&iniciarViagem(v,alvo.l,im,f,true))v.prox=S.simMs+60*6e4})}

 else if(t.tipo==="rec"){const x=S.rec.find(y=>y.id===t.ref);if(!x)return fimTh(t,"");if(p.t==="avista"){if(p.f==="Cheque"){x.cheque={v:p.v,comp:S.simMs+5*DIA}}else S.caixaGrupo+=p.v;x.v=0;log(`💰 ${x.cli} quitou com ${R$(p.v)} (${p.f})`)}
  else aplicaOferta(x,p);S.rec=S.rec.filter(y=>y.v>0.5||y.cheque);const rest=S.rec.find(y=>y.id===t.ref);fimTh(t,rest&&rest.v>0.5?`Saldo restante: ${R$(rest.v)}`:"Dívida resolvida ✅")}
 else if(t.tipo==="veic")fecharVeicTh(t);
 else if(t.tipo==="ter"){const o=t.of;if(p.f.includes("12x")){for(let k=0;k<12;k++)addConta(`Terreno ${o.cid} (${k+1}/12)`,p.v/12,S.simMs+(k+1)*30*DIA,"Imóvel","Proprietário do terreno")}else{if((S.caixaGrupo+(window.LIMNEG?LIMNEG():0))<p.v)return toast("Caixa insuficiente");S.caixaGrupo-=p.v}
  S.ter.push({id:S.nid++,cid:o.cid,end:o.desc,m2:o.m2,val:Math.round(o.m2*precoM2(o.cid)),uso:`Terreno ${o.m2.toLocaleString("pt-BR")} m² – ${o.cid}`,proprio:true});S.ofertas=S.ofertas.filter(x=>x!==o);log(`🏗️ Terreno comprado em ${o.cid} por ${R$(p.v)}`);fimTh(t,"Escritura em andamento. Terreno já aparece em 🏗️ Terrenos.")}
 else if(t.tipo==="cand"){const c=t.cand;const f=contratar(c.loja,c.cargo,c.nome,p.sal);f.vis=c.vis;f.idade=c.idade;f.exp=c.exp;fimTh(t,`${c.nome} foi contratado(a) para ${nomeLoja(S.lojas[c.loja])} ✅`);toast(`${c.nome} contratado(a)!`)}
 else if(t.tipo==="cli")aceitaCli(t);
 render()}
function fimTh(t,msg){t.fim=true;t.prop=null;if(msg)msgAdd(t,"sys",msg);t.lida=true;if(thAberta===t.id)abrirThread(t.id)}
function recusarTh(id){const t=th(id);t.prop=null;msgAdd(t,"eu","Não vou aceitar essa.");t.fim=true;msgAdd(t,"sys","Negociação encerrada.");abrirThread(id)}
// ---------- composer (minha proposta) por tipo ----------
function composer(t){if(t.fim||t.aguard)return"";const P=t.prop||{};
 if(t.tipo==="ctrl")return"";if(t.tipo==="conta"){const c=S.contas.find(x=>x.id===t.ref);if(!c)return"";return `<div class="formg"><label>Valor que proponho<input id="cpV" type="number" value="${(P.v||c.v*.85).toFixed?(P.v||c.v*.85).toFixed(2):P.v}"></label><label>Prazo (dias)<input id="cpP" type="number" value="${P.p||15}"></label><label>Parcelas<input id="cpN" type="number" min="1" max="24" value="${P.n||1}"></label></div><button class="b bl" style="margin-top:8px" onclick="mandaConta(${t.id})">Enviar minha proposta</button>`}
 if(t.tipo==="rec"){const x=S.rec.find(y=>y.id===t.ref);if(!x)return"";return `<div class="formg"><label>Pedir à vista (R$)<input id="cpV" type="number" value="${(x.v*.9).toFixed(2)}"></label><label>Forma<select id="cpF"><option>Pix</option><option>Dinheiro</option><option>TED</option><option>Cheque</option><option>Cartão</option></select></label></div><div class="row" style="margin-top:8px"><button class="b bl" onclick="mandaRec(${t.id},1)">Enviar proposta à vista</button><button class="b s" onclick="mandaRec(${t.id},0)">Pedir outra forma de pagamento</button></div>`}
 if(t.tipo==="veic"){const us=S.frota.filter(v=>v.status==="Garagem");return `<div class="formg"><label>Minha oferta (R$)<input id="cpV" type="number" value="${Math.round(P.v||t.preco*.86)}"></label><label>Pagamento<select id="cpG"><option value="vista">À vista (Pix/TED)</option><option value="fin36">Financiado 36x</option><option value="fin48">Financiado 48x</option><option value="fin60">Financiado 60x</option><option value="cdc">Consórcio contemplado</option></select></label><label>Entrada % (se financiar)<input id="cpE" type="number" value="20"></label><label>Dar usado na troca<select id="cpU"><option value="">Não</option>${us.map(v=>`<option value="${v.id}">${esc(v.mod)} ${v.placa} (~${K$(v.val*.88)})</option>`).join("")}</select></label></div><div class="row" style="margin-top:8px"><button class="b bl" onclick="mandaVeic(${t.id})">Enviar oferta</button><button class="b s" onclick="pedirPrazoTh(${t.id})">Pedir entrega mais rápida</button></div>`}
 if(t.tipo==="ter")return `<div class="formg"><label>Minha oferta (R$)<input id="cpV" type="number" value="${Math.round(P.v||t.of.val*.85)}"></label><label>Pagamento<select id="cpF"><option>Pix</option><option>TED</option><option>Cheque</option><option>Parcelado 12x</option></select></label></div><button class="b bl" style="margin-top:8px" onclick="mandaTer(${t.id})">Enviar oferta</button>`;
 if(t.tipo==="cand")return `<div class="formg"><label>Salário que ofereço (R$)<input id="cpV" type="number" value="${P.sal||Math.round(t.cand.pret*.9)}"></label></div><button class="b bl" style="margin-top:8px" onclick="mandaCand(${t.id})">Enviar proposta de salário</button>`;
 if(t.tipo==="cli")return composerCli(t);return""}
function mandaConta(id){const t=th(id),v=+cpV.value,p=Math.max(0,+cpP.value),n=Math.max(1,+cpN.value);t.minha={v,p,n};t.prop=null;msgAdd(t,"eu",`Proponho ${R$(v)}${n>1?` em ${n}x`:""}, pagando em ${p} dias.`);esperar(t);abrirThread(id)}
function mandaRec(id,av){const t=th(id);if(av){t.minha={v:+cpV.value,f:cpF.value};msgAdd(t,"eu",`Faz ${R$(t.minha.v)} à vista no ${t.minha.f} que eu dou baixa em tudo.`)}else{t.minha=null;msgAdd(t,"eu","Me passa outra forma de pagamento então.")}t.prop=null;esperar(t,20,90);abrirThread(id)}
function mandaVeic(id){const t=th(id),uid=cpU.value?+cpU.value:null,us=uid&&S.frota.find(x=>x.id===uid);t.minha={v:+cpV.value,pg:cpG.value,ent:Math.min(100,Math.max(0,+cpE.value))/100,uid,uv:us?us.val*.88:0};t.prop=null;
 msgAdd(t,"eu",`Ofereço ${R$(t.minha.v)} ${t.minha.pg==="vista"?"à vista":t.minha.pg==="cdc"?"com carta de consórcio":"financiado ("+t.minha.pg.slice(3)+"x, entrada "+Math.round(t.minha.ent*100)+"%)"}${us?` + meu ${us.mod} na troca`:""}.`);esperar(t,25,100);abrirThread(id)}
function pedirPrazoTh(id){const t=th(id);msgAdd(t,"eu","Preciso dele rápido, consegue adiantar a entrega?");if(t.prazo>7&&Math.random()<.6){t.prazo=Math.max(5,Math.round(t.prazo/2));t.min*=1.02;msgAdd(t,"ele",`Consigo puxar de outra concessionária: entrega em <b>${t.prazo} dias</b>, mas o desconto diminui um pouco.`)}else msgAdd(t,"ele",`O melhor prazo que tenho é ${t.prazo} dias mesmo.`);abrirThread(id)}
function mandaTer(id){const t=th(id);t.minha={v:+cpV.value,f:cpF.value};t.prop=null;msgAdd(t,"eu",`Ofereço ${R$(t.minha.v)} – ${t.minha.f}.`);esperar(t,30,120);abrirThread(id)}
function mandaCand(id){const t=th(id);t.minha={sal:+cpV.value};t.prop=null;msgAdd(t,"eu",`Posso oferecer ${R$(t.minha.sal)} de salário.`);esperar(t,10,45);abrirThread(id)}
// ---------- tela da conversa ----------
function abrirThread(id){const t=th(id);thAberta=id;t.lida=true;
 const acoes=t.prop&&!t.fim?`<div class="veh" style="margin:8px 0;border-color:#ffb400"><div class="muted" style="margin-bottom:6px">Proposta de ${esc(t.com)}:</div><div class="row"><button class="b g" onclick="aceitarTh(${id})">${t.prop.aceita?"Fechar negócio":"Aceitar proposta"}</button><button class="b r" onclick="recusarTh(${id})">Recusar e encerrar</button></div></div>`:"";
 modal(`<div class="row sb"><h2 style="margin:0">${t.av} ${esc(t.com)}</h2><button class="b s" onclick="thAberta=null;fecha();if(aba==='msgs')render()">✕</button></div>
 <div class="chat" id="chat" style="max-height:46vh">${t.msgs.map(m=>`<div class="msg ${m[0]}">${m[1]}${m[0]!=="sys"?`<div style="font-size:9px;opacity:.6;margin-top:3px">${new Date(m[2]).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>`:""}</div>`).join("")}${t.aguard?`<div class="msg sys">✍️ ${esc(t.com)} está digitando…</div>`:""}</div>
 ${acoes}${t.fim?'<p class="muted">Conversa encerrada.</p>':composer(t)}`);setTimeout(()=>{const c=document.getElementById("chat");if(c)c.scrollTop=1e9},0)}
// ---------- pontos de entrada (substituem as negociações antigas) ----------
function negociar(id){const c=S.contas.find(x=>x.id===id),rig={Impostos:.0,Pessoal:0,Energia:.03,Água:.04,Telecom:.1,Imóvel:.08,Frota:.07,Serviços:.12,Fornecedor:.14,Financiamento:.02,Multa:0,Outros:.15}[c.cat]??.1;
 const t=novaThread("conta",id,c.credor||"Credor","🏢",`Olá, aqui é do(a) <b>${esc(c.credor||"credor")}</b>. Sobre "${esc(c.desc)}", valor <b>${R$(c.v)}</b>, vencimento ${new Date(c.venc).toLocaleDateString("pt-BR")}. Qual a sua proposta?`);
 if(t.base==null){t.base=c.v;t.min=c.v*(1-rig-Math.random()*.03)}abrirThread(t.id)}
function cobrar(id){const x=S.rec.find(y=>y.id===id);const t=novaThread("rec",id,x.cli,"🧑‍🌾");if(!t.msgs.length){msgAdd(t,"sys",`Dívida: ${R$(x.v)} – ${esc(x.desc)}`);msgAdd(t,"eu",`Olá! Consta em aberto ${R$(x.v)} com a gente. Como vamos resolver?`);esperar(t,15,60)}abrirThread(t.id)}
function negVeic(di,ii){const d=DEALERS[di],it=d.itens[ii],key=di+"_"+ii;let t=S.msgs.find(x=>x.tipo==="veic"&&x.ref.join("_")===key&&!x.fim);
 if(!t){const pronta=Math.random()<.4;t=novaThread("veic",[di,ii],`${d.vend} – ${d.loja}`,"🚚",`Olá! Sou ${d.vend}, da ${d.loja}. O <b>${it[0]}</b> sai por <b>${R$(it[3])}</b>. ${pronta?"Tenho a pronta entrega! ":"Esse é sob encomenda da fábrica. "}Prazo: <b>${0}</b> dias. Me manda sua oferta!`);
  t.prazo=pronta?ri(2,7):ri(20,60);t.msgs[0][1]=t.msgs[0][1].replace("<b>0</b>",`<b>${t.prazo}</b>`);t.preco=it[3];t.min=it[3]*r(it[4]?.93:.86,it[4]?.97:.92)}abrirThread(t.id)}
function fecharVeicTh(t){const d=DEALERS[t.ref[0]],it=d.itens[t.ref[1]],f=t.prop,us=f.uid&&S.frota.find(x=>x.id===f.uid);let pagar=Math.max(0,f.v-(us?f.uv:0));
 if(f.pg==="vista"||f.pg==="cdc"){if((S.caixaGrupo+(window.LIMNEG?LIMNEG():0))<pagar)return toast("Caixa insuficiente – tente financiar");S.caixaGrupo-=pagar}
 else{const n=+f.pg.slice(3),e=pagar*f.ent;if((S.caixaGrupo+(window.LIMNEG?LIMNEG():0))<e)return toast("Caixa insuficiente para a entrada");S.caixaGrupo-=e;const fin=pagar-e,i=.0139,parc=fin*i/(1-Math.pow(1+i,-n));S.fin.push({desc:`${d.m} ${it[0]}`,n,pagas:0,parc,banco:"Banco "+d.m.split(" ")[0]});log(`🏦 Financiado ${R$(fin)} em ${n}x de ${R$(parc)}`)}
 if(us){S.frota=S.frota.filter(x=>x!==us);log(`🔁 ${us.mod} ${us.placa} dado na troca`)}
 S.pedidos.push({marca:d.m,mod:it[0],tipo:it[1],cap:it[2],val:f.v,chega:S.simMs+t.prazo*DIA,loja:d.loja});log(`🛒 Compra fechada: ${it[0]} (${d.loja}) por ${R$(f.v)} – entrega em ${t.prazo} dias`);fimTh(t,`Contrato assinado ✅ Entrega prevista: ${new Date(S.simMs+t.prazo*DIA).toLocaleDateString("pt-BR")}.`);toast("Contrato assinado!")}
function negTer(i){const o=S.ofertas[i];let t=S.msgs.find(x=>x.tipo==="ter"&&x.of===o&&!x.fim);if(!t){t=novaThread("ter",S.nid,`Corretor – terreno em ${o.cid}`,"🏡",`Sou o corretor do terreno em <b>${o.cid}</b> (${o.m2.toLocaleString("pt-BR")} m², ${o.desc}). O proprietário pede <b>${R$(o.val)}</b>. Faça sua oferta.`);t.of=o;t.min=o.val*r(.82,.93)}abrirThread(t.id)}
// ---------- controlador financeiro e cobrador trabalhando sozinhos ----------
function rotinaFinanceira(){const d=new Date(S.simMs),h=d.getHours(),m=d.getMinutes();if(m!==0)return;const fin=S.func.find(f=>f.cargo==="fin"),cob=S.func.find(f=>f.cargo==="cob");
 if(fin&&(h===9||h===15)){const alvo=S.contas.filter(c=>!c.pago&&!c.neg&&!["Impostos","Pessoal","Multa","Financiamento"].includes(c.cat)&&!S.msgs.some(t=>(t.tipo==="ctrl"||t.tipo==="conta")&&t.ref===c.id&&!t.fim)).sort((a,b)=>b.v-a.v).slice(0,2);
  alvo.forEach(c=>{const desc=r(.03,.13),n=c.v>20000?ri(1,4):1,p=ri(7,30),v=+(c.v*(1-desc)).toFixed(2);const t=novaThread("ctrl",c.id,`${fin.nome} (Controlador)`,"📊");t.prop={v,p,n};
   msgAdd(t,"ele",`Chefe, negociei com <b>${esc(c.credor)}</b> a conta "${esc(c.desc)}" (${R$(c.v)}). Consegui <b>${R$(v)}</b>${n>1?` em ${n}x`:""} com ${p} dias de prazo (economia de ${R$(c.v-v)}). Aprova?`);toast(`📊 ${fin.nome} mandou uma negociação pra aprovar`)})}
 if(cob&&(h===10||h===16)){S.rec.filter(x=>x.venc<S.simMs&&!x.cheque&&!S.msgs.some(t=>t.tipo==="rec"&&t.ref===x.id&&!t.fim)).slice(0,2).forEach(x=>{const t=novaThread("rec",x.id,x.cli,"🧑‍🌾");msgAdd(t,"sys",`${cob.nome} (cobrador) entrou em contato com ${esc(x.cli)} sobre ${R$(x.v)} em atraso.`);esperar(t,20,120)})}}

V.msgs=function(){const ts=S.msgs.slice().sort((a,b)=>(a.fim-b.fim)||(b.upd-a.upd));
 return `<div class="card"><h3>Conversas e negociações <span class="pill ${naoLidas()?"y":""}">${naoLidas()} não lidas</span></h3><p class="muted" style="margin-bottom:8px">Você manda a proposta, a outra pessoa analisa e responde aqui (leva de alguns segundos a alguns minutos). Com um <b>Controlador financeiro</b> ou um <b>Cobrador</b> na equipe, eles negociam sozinhos e só te trazem a proposta pra aprovar.</p>
 <div class="tw" style="max-height:none">${ts.map(t=>`<div class="veh row sb" style="margin:6px 0;cursor:pointer;${!t.lida?"border-color:#ffb400":""}" onclick="abrirThread(${t.id})"><div><b>${t.av} ${esc(t.com)}</b> ${!t.lida?'<span class="pill y">nova</span>':""}${t.aguard?'<span class="pill b">pensando…</span>':""}${t.fim?'<span class="pill">encerrada</span>':""}<div class="muted" style="margin-top:3px">${(t.msgs[t.msgs.length-1]||["",""])[1].replace(/<[^>]+>/g,"").slice(0,110)}</div></div><span class="muted">${new Date(t.upd).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span></div>`).join("")||'<p class="muted">Nenhuma conversa ainda. Negocie uma conta, cobre um cliente, faça oferta num caminhão ou terreno, ou contrate alguém.</p>'}</div></div>`};

function aplicaOferta(x,o){if(o.t==="pix"){const v=+o.n.match(/R\$\s?([\d.,]+)/)[1].replace(/\./g,"").replace(",",".");S.caixaGrupo+=v;x.v-=v;x.venc=S.simMs+30*DIA;log(`💰 Recebido Pix ${R$(v)} de ${x.cli}`)}
 else if(o.t==="cheque"){x.cheque={v:x.v,comp:S.simMs+30*DIA};x.v=0;log(`🧾 ${x.cli} entregou cheque pré-datado`)}
 else if(o.t==="parc"){const n=+o.n.match(/(\d+)x/)[1],v=x.v;S.rec=S.rec.filter(y=>y!==x);for(let k=0;k<n;k++)S.rec.push({id:S.nid++,cli:x.cli,v:v/n,orig:v/n,venc:S.simMs+(k+1)*30*DIA,desc:`Parcela ${k+1}/${n} – acordo`});x.v=0;log(`📄 ${x.cli} parcelou em ${n}x`)}
 else{const b=o.bem,abat=Math.min(b.val,x.v);receberBem(b,x.cli);x.v-=abat;if(b.val>abat+1)S.dev.push({id:S.nid++,cli:x.cli,desc:`Diferença a devolver – ${b.nome}`,v:b.val-abat,venc:S.simMs+15*DIA})}}

// ---- comprador / estoquista fazendo pedidos sozinho ----
function cfgCompra(l){if(!l.cmp)l.cmp={on:true,min:5,alvo:20};return l.cmp}
function quemCompra(l){return S.func.find(f=>f.loja===l.id&&(f.cargo==="comp"||f.cargo==="est"))||S.func.find(f=>f.cargo==="comp")}
function rotinaCompras(){const d=new Date(S.simMs);if(d.getMinutes()!==0||![8,14].includes(d.getHours())||d.getDay()===0)return;
 S.compras=S.compras||[];
 lojasVenda().forEach(l=>{const c=cfgCompra(l);if(!c.on)return;const f=quemCompra(l);if(!f)return;
  const pend=new Set(S.compras.filter(p=>p.loja===l.id).flatMap(p=>p.itens.map(i=>i[0])));
  const itens=S.prods.filter(p=>p.seg===segDe(l)&&(l.est[p.id]||0)<c.min&&!pend.has(p.id)).map(p=>[p.id,c.alvo-(l.est[p.id]||0)]);if(!itens.length)return;
  const tot=itens.reduce((a,[i,q])=>a+prod(i).custo*q,0);if(window.empCtx)empCtx(l);if((S.caixaGrupo+(window.LIMNEG?LIMNEG():0))<tot){log(`⚠️ ${f.nome} não conseguiu comprar para ${nomeLoja(l)}: caixa insuficiente`);return}
  S.caixaGrupo-=tot;const forn=segDe(l)==="const"?pick(["Votorantim Cimentos","Gerdau","Tigre","Suvinil","Distribuidora Norte Materiais"]):pick(["Vibra (Lubrax)","Raízen (Shell)","Ipiranga","Petronas Lubrificantes","Moove (Mobil)","Tecfil / Sofape"]);
  S.compras.push({id:S.nid++,loja:l.id,itens,tot,forn,por:f.nome,chega:S.simMs+ri(1,3)*DIA+ri(0,6)*36e5});log(`📋 ${f.nome} fez pedido para ${nomeLoja(l)}: ${itens.length} itens com ${forn} – ${R$(tot)}`)});
 }
function chegadaCompras(){if(!S.compras)return;S.compras=S.compras.filter(p=>{if(S.simMs>=p.chega){const l=S.lojas[p.loja];p.itens.forEach(([i,q])=>l.est[i]=(l.est[i]||0)+q);log(`🚛 Chegou o pedido de ${p.forn} em ${nomeLoja(l)} (${p.itens.length} itens)`);return false}return true})}
// ---- contratação com candidatos (currículos) ----
function candidatos(cargo,loja){const base=CARGOS[cargo].s;return Array.from({length:4},()=>{const v=novoVisual(),exp=ri(0,15),idade=ri(19,55);return{nome:pick(NOMES)+" "+pick(SOBR),cargo,loja,idade,exp,pret:Math.round(base*(.88+exp*.025+r(0,.12))/10)*10,nota:Math.min(10,(5+exp*.3+r(-1.5,1.5))).toFixed(1),vis:{pele:v.pele,cabelo:v.cabelo,estilo:v.estilo}}})}
let CANDS=[];
function abrirContratacao(cargo,loja){cargo=cargo||"vend";loja=loja==null?lojaSel:loja;CANDS=candidatos(cargo,loja);
 modal(`<div class="row sb"><h2 style="margin:0">👷 Contratar</h2><button class="b s" onclick="fecha()">✕</button></div>

<script>
/* Sincronização ao vivo — script acrescentado (não altera a lógica do jogo) */
/* ==================== SINCRONIZAÇÃO AO VIVO (PC ↔ celular) ==================== */
(function () {
  'use strict';
  if (window.__lpSync) return;
  window.__lpSync = true;

  const SS_DEV = 'grupoLP_dev_aba';
  const LS_DEV_ANTIGO = 'grupoLP_dev';
  const LS_COD = 'grupoLP_sync';
  const LS_OFF = 'grupoLP_sync_off';
  const CODIGO_FIXO = 'LPGRUPOLP01'; // sincronização automática entre aparelhos
  const CEL = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const TICK = 60000;        // uma sincronização por minuto (download) por aparelho
  const MIN_ENTRE_ENVIOS = 60000; // upload só quando algo mudou, no máximo 1 por minuto

  // deviceId por aba: abas do mesmo navegador contam como aparelhos diferentes
  const dev = (function () {
    let d = '';
    try { d = sessionStorage.getItem(SS_DEV) || ''; } catch (e) {}
    if (!d) {
      d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      try { sessionStorage.setItem(SS_DEV, d); } catch (e) {}
    }
    try { localStorage.removeItem(LS_DEV_ANTIGO); } catch (e) {} // id antigo compartilhado
    return d;
  })();

  const syncDesligado = (function () { try { return localStorage.getItem(LS_OFF) === '1'; } catch (e) { return false; } })();
  let codigo = (localStorage.getItem(LS_COD) || '').trim();
  let primeiraConexao = false;
  if (!codigo && !syncDesligado) {
    codigo = CODIGO_FIXO;         // sem código salvo: entra sozinho no código do grupo
    primeiraConexao = true;
    try { localStorage.setItem(LS_COD, codigo); } catch (e) {}
  }
  let mestre = false;
  let online = false;
  let ultimoRemoto = 0;
  let ultimoEnvio = 0;
  let ultimoJson = '';
  let ultimaAssinatura = ''; // hash do conteúdo já enviado (ignora simMs/lastReal)
  let ultimaAcaoEnvio = 0;
  let pendente = null;
  let timer = null;
  let enviando = false;
  let tAcao = null;
  let ultimoCiclo = 0;

  /* ---------- utilidades ---------- */
  function toast_(t) { try { toast(t); } catch (e) {} }

  function gerarCodigo() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    let n = '';
    for (let i = 0; i < 4; i++) n += Math.floor(Math.random() * 10);
    return 'LP-' + n + '-' + abc[Math.floor(Math.random() * abc.length)] + abc[Math.floor(Math.random() * abc.length)];
  }

  // assinatura do conteúdo do jogo, ignorando o que muda a cada frame
  function assinaturaDe(texto) {
    let t = texto;
    try {
      const o = JSON.parse(texto);
      if (o && typeof o === 'object') { o.simMs = 0; o.lastReal = 0; t = JSON.stringify(o); }
    } catch (e) {}
    let h = 5381;
    for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) | 0;
    return t.length + ':' + h;
  }

  function normalizar(v) {
    return String(v || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20);
  }

  function podeAplicar() {
    const a = document.activeElement;
    if (a && a.matches && a.matches('input,select,textarea')) return false;
    if (a && a.isContentEditable) return false;
    const m = document.getElementById('modal');
    if (m && m.style.display === 'flex' && m.innerHTML.trim()) return false;
    return true;
  }

  /* ---------- backend: 1 requisição por minuto por aparelho ---------- */
  // POST /api/sync faz tudo numa chamada só: renova/pega a trava do mestre e,
  // quando o estado mudou, envia o jogo; devolve o estado do servidor apenas
  // se ele for mais novo que o que este aparelho já tem.
  async function sincronizar() {
    if (!codigo || typeof S === 'undefined' || !S) return false;
    if (document.visibilityState !== 'visible') return false; // aba oculta: sem rede
    const agora = Date.now();
    let assin = '';
    try { assin = assinaturaDe(JSON.stringify(S)); } catch (e) { assin = ''; }
    const mudou = !!assin && assin !== ultimaAssinatura && !primeiraConexao;
    const corpo = { codigo: codigo, dev: dev, since: ultimoRemoto };
    if (mudou) { corpo.ver = agora; corpo.data = S; }
    let j = null;
    try {
      const r = await fetch((location.hostname.endsWith('freebuff.page')?'':'https://site-c1c35292136b4c749aabc6d8924009aa.freebuff.page')+'/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo),
      });
      if (!r.ok) throw new Error('sync ' + r.status);
      j = await r.json();
      online = true;
    } catch (e) {
      online = false;
      chip();
      return false;
    }
    if (mudou) { ultimaAssinatura = assin; ultimoEnvio = agora; }
    const euSouMestre = !!(j && j.mestre === true);
    if (euSouMestre !== mestre) {
      mestre = euSouMestre;
      if (mestre && typeof S === 'object' && S) S.simMs = Date.now();
      try { render(); } catch (e) {}
    }
    const verServidor = Number(j && j.ver) || 0;
    if (j && j.data && j.dev !== dev && verServidor > ultimoRemoto) {
      tratarRemoto({ ver: verServidor, dev: j.dev, data: j.data });
    } else if (verServidor > ultimoRemoto) {
      ultimoRemoto = verServidor;
    }
    if (!mestre && typeof S === 'object' && S) S.simMs = Date.now();
    chip();
    return true;
  }

  /* ---------- estado remoto ---------- */
  function aplicarRemoto(e) {
    let texto = '';
    try { texto = JSON.stringify(e.data); } catch (err) { texto = ''; }
    ultimoRemoto = Math.max(ultimoRemoto, Number(e.ver) || 0);
    if (texto && texto === ultimoJson) return; // nada mudou de fato
    ultimoJson = texto;
    const y = window.scrollY;
    try { S = e.data; } catch (err) { return; }
    if (!S || typeof S !== 'object') return;
    if (typeof S.simMs !== 'number') S.simMs = Date.now();
    if (!mestre) S.simMs = Date.now();
    // v15: reconhece empresas e lojas do estado recebido da nuvem
    try { if (typeof carregarEmpresas === 'function') carregarEmpresas(); } catch (err) {}
    try { window.reconhecerEmpresas && window.reconhecerEmpresas(); } catch (err) {}
    try { save(); } catch (err) { try { localStorage.setItem('grupoLP4', JSON.stringify(S)); } catch (e2) {} }
    try { render(); nav(); } catch (err) {}
    window.scrollTo(0, y);
  }

  function tratarRemoto(e) {
    if (!e || typeof e.ver !== 'number' || e.ver <= 0) return;
    if (!e.data || !e.dev || e.dev === dev) { ultimoRemoto = Math.max(ultimoRemoto, e.ver); return; }
    if (e.ver <= ultimoRemoto) return;
    if (podeAplicar()) aplicarRemoto(e);
    else pendente = e;
  }

  /* ---------- ciclo: 1x por minuto e só com a aba visível ---------- */
  function agendar(ms) {
    clearTimeout(timer);
    timer = setTimeout(ciclo, Math.max(0, ms));
  }

  async function ciclo() {
    timer = null;
    if (!codigo) { chip(); return agendar(TICK); }
    if (document.visibilityState !== 'visible') { chip(); return; } // aba oculta: para tudo
    ultimoCiclo = Date.now();
    const ok = await sincronizar();
    if (primeiraConexao && ok) {
      primeiraConexao = false;
      if (!ultimoRemoto) {
        ultimaAssinatura = ''; // servidor vazio: manda o jogo deste aparelho
        if (await sincronizar()) toast_('Jogo enviado para o servidor');
      } else {
        toast_('Jogo carregado do servidor');
      }
    }
    agendar(TICK);
  }

  /* ---------- chip no topo ---------- */
  function chip() {
    const chips = document.querySelector('#top .chips');
    if (!chips) return;
    let el = document.getElementById('syncChip');
    if (!el) {
      el = document.createElement('div');
      el.id = 'syncChip';
      el.className = 'chip';
      chips.appendChild(el);
    }
    const ligado = !!codigo;
    const ok = ligado && online;
    const cor = !ligado ? 'var(--mu)' : ok ? 'var(--ok)' : 'var(--bad)';
    const txt = !ligado ? 'Offline' : ok ? 'Sincronizado' : 'Offline';
    const papel = mestre ? 'principal' : 'espelho';
    el.innerHTML =
      '<small>Sincronização</small><span style="color:' + cor + '">● ' + txt +
      ' • ' + (CEL ? 'celular' : 'PC') + ' • ' + papel + '</span>';
  }

  /* ---------- cartão na aba Config ---------- */
  function corpoCard() {
    if (!codigo) {
      return (
        '<div class="row">Aparelho: <b>' + (CEL ? 'celular' : 'PC') + '</b> · sem código (funcionando local)</div>' +
        '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<button class="b" data-sync="criar">Criar código</button>' +
        '<span style="color:var(--mu)">gere um código aqui e digite no outro aparelho</span></div>' +
        '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<input id="syncCodigo" placeholder="LP-0000-XX" maxlength="14" style="max-width:170px" autocomplete="off">' +
        '<button class="b" data-sync="conectar">Conectar</button></div>'
      );
    }
    return (
      '<div class="row">Código: <b id="syncCod">' + codigo + '</b> · aparelho: <b>' + (CEL ? 'celular' : 'PC') + '</b>' +
      ' · papel: <b>' + (mestre ? 'principal' : 'espelho') + '</b></div>' +
      '<div class="row" style="color:var(--mu)">' + (online ? 'Conectado' : 'Sem conexão') + ' · ' +
      (mestre ? 'este aparelho roda a simulação' : 'espelho — a simulação vem do outro aparelho') + '</div>' +
      '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="b" data-sync="copiar">Copiar código</button>' +
      '<button class="b r" data-sync="desconectar">Desconectar</button></div>'
    );
  }

  function cardHTML() {
    return '<div class="card" id="syncCard"><h3>Sincronizar PC e celular</h3>' + corpoCard() + '</div>';
  }

  /* ---------- ações ---------- */
  function conectar(valor) {
    const c = normalizar(valor);
    if (c.length < 6) { toast_('Código inválido'); return; }
    codigo = c;
    try { localStorage.setItem(LS_COD, codigo); localStorage.removeItem(LS_OFF); } catch (e) {}
    ultimoRemoto = 0;
    ultimoJson = '';
    mestre = false;
    pendente = null;
    try { render(); } catch (e) {}
    chip();
    agendar(50);
  }

  function criarCodigo() {
    codigo = gerarCodigo();
    try { localStorage.setItem(LS_COD, codigo); localStorage.removeItem(LS_OFF); } catch (e) {}
    ultimoRemoto = 0;
    ultimoJson = '';
    mestre = false;
    pendente = null;
    try { navigator.clipboard.writeText(codigo).catch(function () {}); } catch (e) {}
    try { render(); } catch (e) {}
    toast_('Código ' + codigo + ' criado');
    chip();
    agendar(50);
  }

  function desconectar() {
    codigo = '';
    try { localStorage.removeItem(LS_COD); localStorage.setItem(LS_OFF, '1'); } catch (e) {}
    mestre = false;
    online = false;
    pendente = null;
    clearTimeout(timer);
    try { render(); } catch (e) {}
    chip();
    toast_('Sincronização desligada');
  }

  function acaoUsuario() {
    if (!codigo || !timer) return;
    if (document.visibilityState !== 'visible') return;
    const desde = Date.now() - ultimoCiclo;
    if (desde >= MIN_ENTRE_ENVIOS) agendar(800);
  }

  /* ---------- integração sem tocar na lógica ---------- */
  function iniciar() {
    try {
      const cfgOriginal = V.config;
      V.config = function () { return cfgOriginal.call(V) + cardHTML(); };
    } catch (e) {}

    document.addEventListener('click', function (ev) {
      const alvo = ev.target && ev.target.closest && ev.target.closest('[data-sync]');
      if (alvo) {
        ev.preventDefault();
        ev.stopPropagation();
        const a = alvo.dataset.sync;
        if (a === 'criar') criarCodigo();
        else if (a === 'conectar') {
          const inp = document.getElementById('syncCodigo');
          conectar(inp ? inp.value : '');
        } else if (a === 'desconectar') desconectar();
        else if (a === 'copiar') {
          try { navigator.clipboard.writeText(codigo).then(function () { toast_('Código copiado'); }, function () {}); } catch (e) {}
        }
        return;
      }
      acaoUsuario();
    }, true);

    document.addEventListener('change', function (ev) {
      const t = ev.target;
      if (t && t.closest && t.closest('#syncCard')) return;
      acaoUsuario();
    }, true);

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && ev.target && ev.target.id === 'syncCodigo') {
        ev.preventDefault();
        conectar(ev.target.value);
      }
    }, true);

    // no aparelho espelho a simulação não avança
    try {
      if (typeof tickMinuto === 'function' && !tickMinuto.__syncGuard) {
        const original = tickMinuto;
        const guarda = function () { if (codigo && !mestre) return; return original.apply(this, arguments); };
        guarda.__syncGuard = true;
        tickMinuto = guarda;
      }
    } catch (e) {}

    document.addEventListener('visibilitychange', function () {
      if (!codigo) return;
      if (document.visibilityState === 'visible') {
        clearTimeout(timer);
        agendar(400); // voltou: sincroniza uma vez
      } else {
        clearTimeout(timer); // aba oculta: nenhuma requisição
        timer = null;
      }
    });

    setInterval(function () {
      if (pendente && podeAplicar()) {
        const p = pendente;
        pendente = null;
        aplicarRemoto(p);
      }
    }, 1000);

    setInterval(chip, 5000);
    chip();
    if (codigo) agendar(200);
  }

  // espera o jogo terminar de montar S/V
  (function esperar(tentativas) {
    const pronto = function () {
      return typeof S !== 'undefined' && S && typeof V === 'object' && typeof render === 'function';
    };
    if (pronto()) return iniciar();
    if (tentativas <= 0) return;
    setTimeout(function () { esperar(tentativas - 1); }, 150);
  })(80);
})();
